<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correlation Coefficient Upper Third</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for a professional look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* Using the Inter font family for a clean, modern look */
        body {
            font-family: 'Inter', sans-serif;
            /* Demo background, you can remove this */
            background-image: url('https://placehold.co/1920x1080/334155/94a3b8?text=Your+Radar+Map+Here');
            background-size: cover;
            overflow: hidden; /* Hide scrollbars for the demo */
        }

        /* --- Custom Animations --- */
        @keyframes slideInDown {
            from { transform: translateY(-110%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Animation classes */
        .animate-slideInDown {
            animation: slideInDown 0.7s ease-out forwards;
        }
        .animate-fadeIn {
            opacity: 0; /* Start hidden */
            animation: fadeIn 0.5s ease-out forwards;
            animation-fill-mode: forwards;
        }
        
        /* Staggered animation delays */
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }
    </style>
</head>
<body class="bg-slate-700">

    <!-- 
      Upper Third Container
    -->
    <div id="upper-third-container" class="fixed top-4 left-4 right-4 z-50 animate-slideInDown" style="overflow: visible;">

        <!-- 
            Main Bar: Holds Logo, Info, and Clock
        -->
        <div class="relative inline-flex items-center bg-black/70 backdrop-blur-sm text-white p-2 rounded-lg shadow-2xl">
            
            <div class="absolute top-1/2 -translate-y-1/2 left-4 z-10 animate-fadeIn delay-300">
                <img src="ONW_Logo.png" alt="Ohio News & Weather Logo" class="h-24 drop-shadow-lg">
            </div>

            <!-- Spacer to prevent content from going under the logo -->
            <div class="w-48"></div>

            <!-- 
                Center Content: Title, Legends
            -->
            <div class="flex flex-col justify-center px-4 animate-fadeIn delay-500">
                <h1 id="main-title" class="text-3xl font-black tracking-wider uppercase">
                    LIVE STORM TRACKER
                </h1>
                
                <div class="flex items-center gap-6 mt-1">
                    <!-- 
                        CORRELATION COEFFICIENT LEGEND
                        - UPDATED: Replaced velocity colors with your CC palette.
                        - UPDATED: Changed labels to "LOW" and "HIGH".
                    -->
                    <div id="cc-legend" class="flex items-center gap-px">
                        <span class="text-xs font-semibold mr-2 opacity-80">LOW</span>
                        <div class="w-3 h-4" title="0.45" style="background-color: rgb(15, 15, 140);"></div>
                        <div class="w-3 h-4" title="0.60" style="background-color: rgb(10, 10, 190);"></div>
                        <div class="w-3 h-4" title="0.75" style="background-color: rgb(120, 120, 255);"></div>
                        <div class="w-3 h-4" title="0.80" style="background-color: rgb(95, 245, 100);"></div>
                        <div class="w-3 h-4" title="0.85" style="background-color: rgb(135, 215, 10);"></div>
                        <div class="w-3 h-4" title="0.90" style="background-color: rgb(255, 255, 0);"></div>
                        <div class="w-3 h-4" title="0.95" style="background-color: rgb(255, 140, 0);"></div>
                        <div class="w-3 h-4" title="0.97" style="background-color: rgb(225, 3, 0);"></div>
                        <div class="w-3 h-4" title="0.99" style="background-color: rgb(139, 30, 77);"></div>
                        <div class="w-3 h-4" title="1.00" style="background-color: rgb(255, 180, 215);"></div>
                        <div class="w-3 h-4" title="1.05" style="background-color: rgb(164, 54, 150);"></div>
                        <span class="text-xs font-semibold ml-2 opacity-80">HIGH</span>
                    </div>
                    <!-- Severe Warning Legend (Unchanged) -->
                    <div id="warning-legend" class="flex items-center gap-3 border-l border-white/20 pl-4">
                        <div class="flex items-center gap-1.5">
                            <div class="w-3 h-3 bg-red-600 rounded-sm"></div>
                            <span class="text-xs font-bold">Tornado</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <div class="w-3 h-3 bg-yellow-400 rounded-sm"></div>
                            <span class="text-xs font-bold">T-Storm</span>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <div class="w-3 h-3 bg-green-500 rounded-sm"></div>
                            <span class="text-xs font-bold">Flash Flood</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 
                Right Side: Clock
            -->
            <div class="text-right px-4 ml-6 animate-fadeIn delay-700">
                <div id="day-display" class="text-md font-bold uppercase">
                    <!-- Day will be injected here -->
                </div>
                <div id="time-display" class="text-2xl font-semibold">
                    <!-- Time will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Control Button (for demonstration) -->
    <div class="fixed top-28 left-1/2 -translate-x-1/2">
        <button onclick="toggleUpperThird()" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:bg-blue-700 transition-colors">
            Show/Hide Upper Third
        </button>
    </div>

    <script>
        // --- JAVASCRIPT FOR DYNAMIC CONTENT ---

        const timeEl = document.getElementById('time-display');
        const dayEl = document.getElementById('day-display');
        const containerEl = document.getElementById('upper-third-container');

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            const dayString = now.toLocaleDateString('en-US', { weekday: 'long' }).toUpperCase();
            timeEl.textContent = timeString;
            dayEl.textContent = dayString;
        }

        updateClock();
        setInterval(updateClock, 1000);

        function toggleUpperThird() {
            containerEl.classList.toggle('hidden');
        }
    </script>

</body>
</html>
